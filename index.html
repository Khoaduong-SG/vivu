<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalGo - Gọi Xe & Giao Đồ Ăn Địa Phương</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
    }
    /* Ẩn thanh cuộn nhưng vẫn cho phép cuộn mượt */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-2 sm:py-5 px-2 bg-slate-200/80 text-slate-800">

  <!-- THANH CHUYỂN ĐỔI VAI TRÒ (ROLE SWITCHER) -->
  <div class="w-full max-w-md mb-3 bg-white rounded-2xl shadow-md p-2 border border-slate-200">
    <div class="flex items-center justify-between px-2 pb-1.5 border-b border-slate-100 mb-1.5">
      <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-700 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        Chế độ trải nghiệm (Chuyển đổi vai trò)
      </span>
      <span class="text-[11px] text-slate-400 font-medium">Dữ liệu đồng bộ tức thì</span>
    </div>
    <div class="grid grid-cols-4 gap-1" id="role-buttons">
      <button onclick="switchRole('customer')" data-role="customer" class="role-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs font-semibold transition-all bg-emerald-600 text-white shadow-sm">
        <i class="fa-solid fa-user text-sm mb-1"></i>
        <span>Khách hàng</span>
      </button>
      <button onclick="switchRole('merchant')" data-role="merchant" class="role-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:bg-slate-100">
        <i class="fa-solid fa-store text-sm mb-1"></i>
        <span>Chủ quán</span>
      </button>
      <button onclick="switchRole('driver')" data-role="driver" class="role-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:bg-slate-100 relative">
        <i class="fa-solid fa-motorcycle text-sm mb-1"></i>
        <span>Tài xế</span>
        <span id="driver-badge" class="hidden absolute top-1 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>
      <button onclick="switchRole('admin')" data-role="admin" class="role-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:bg-slate-100 relative">
        <i class="fa-solid fa-shield-halved text-sm mb-1"></i>
        <span>Admin</span>
        <span id="admin-badge" class="hidden absolute top-1 right-2 w-2 h-2 bg-amber-500 rounded-full"></span>
      </button>
    </div>
  </div>

  <!-- KHUNG ĐIỆN THOẠI MÔ PHỎNG (MOBILE APP CONTAINER) -->
  <div class="w-full max-w-md bg-white rounded-[32px] shadow-2xl border-[6px] border-slate-900 overflow-hidden flex flex-col h-[760px] max-h-[85vh] relative">
    
    <!-- Thanh trạng thái giả lập điện thoại -->
    <div class="bg-slate-900 text-white px-5 py-1.5 flex justify-between items-center text-[11px] font-medium select-none">
      <span>09:45</span>
      <div class="w-20 h-3.5 bg-black rounded-full"></div>
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <!-- Thông báo nổi (Toast Notification thay thế alert) -->
    <div id="toast-container" class="absolute top-12 left-3 right-3 z-50 pointer-events-none flex flex-col gap-2"></div>

    <!-- NỘI DUNG CHÍNH CỦA APP (THAY ĐỔI THEO VAI TRÒ) -->
    <div id="app-content" class="flex-1 overflow-y-auto no-scrollbar bg-slate-50 flex flex-col">
      <!-- Render bằng JavaScript -->
    </div>

  </div>

  <script>
    // ==========================================
    // 1. DỮ LIỆU MẪU & TRẠNG THÁI HỆ THỐNG (STATE)
    // ==========================================

    // Các địa điểm tiêu biểu tại địa phương kèm tọa độ giả lập (x, y tính theo km) để mô phỏng đo khoảng cách tuyến đường
    const LOCAL_PLACES = [
      { id: 'p1', name: 'Chợ Trung Tâm Thị Trấn', x: 2.0, y: 2.0, area: 'Khu vực Trung tâm' },
      { id: 'p2', name: 'Ngã Sáu Trung Tâm', x: 3.2, y: 2.8, area: 'Phường Tân Lập' },
      { id: 'p3', name: 'Bệnh Viện Đa Khoa Khu Vực', x: 5.5, y: 1.5, area: 'Đường Mai Hắc Đế' },
      { id: 'p4', name: 'Trường THPT Chuyên Địa Phương', x: 1.2, y: 4.8, area: 'Đường Nguyễn Tất Thành' },
      { id: 'p5', name: 'Bến Xe Liên Tỉnh Phía Nam', x: 6.8, y: 5.2, area: 'Quốc lộ 14' },
      { id: 'p6', name: 'Quảng Trường 10/3', x: 3.5, y: 3.4, area: 'Trung tâm Hành chính' },
      { id: 'p7', name: 'Khu Dân Cư Đồi Xanh', x: 0.5, y: 1.0, area: 'Xã Hòa Thắng' }
    ];

    // Bảng giá cước gọi xe
    const VEHICLE_TYPES = [
      { id: 'bike', name: 'LocalBike (Xe máy)', rate: 6000, baseFare: 10000, desc: 'Nhanh chóng, linh hoạt ngõ nhỏ', icon: 'fa-motorcycle' },
      { id: 'car', name: 'LocalCar (Ô tô 4 chỗ)', rate: 12000, baseFare: 20000, desc: 'Mát mẻ, che nắng mưa, tối đa 4 khách', icon: 'fa-car-side' }
    ];

    // Trạng thái toàn cục của ứng dụng
    const state = {
      currentRole: 'customer', // 'customer' | 'merchant' | 'driver' | 'admin'
      customerTab: 'ride',     // 'ride' | 'food' | 'orders'
      merchantTab: 'orders',   // 'orders' | 'register'
      driverOnline: true,

      // State đặt xe
      rideForm: {
        pickupId: 'p1',
        dropoffId: 'p3',
        vehicleId: 'bike',
        note: ''
      },

      // Danh sách cửa hàng địa phương
      stores: [
        {
          id: 's1',
          name: 'Bún Đỏ & Bánh Canh Cô Ba',
          address: '45 Phan Chu Trinh (Gần Ngã Sáu)',
          phone: '0914.222.333',
          category: 'Ăn sáng & Đặc sản',
          distanceKm: 1.8,
          rating: 4.9,
          status: 'approved', // 'approved' | 'pending'
          color: 'from-orange-500 to-amber-500',
          menu: [
            { id: 'm1', name: 'Bún đỏ đặc biệt đầy đủ', price: 30000, desc: 'Riêu cua, trứng cút, chả cá, rau cần' },
            { id: 'm2', name: 'Bánh canh bột lọc chả cua', price: 28000, desc: 'Nước dùng ngọt thanh ninh xương' },
            { id: 'm3', name: 'Sữa đậu nành nóng', price: 10000, desc: 'Nhà nấu nguyên chất' }
          ]
        },
        {
          id: 's2',
          name: 'Cơm Tấm Sườn Bì Chả Anh Tư',
          address: '112 Lê Hồng Phong (Gần Chợ Trung Tâm)',
          phone: '0988.555.666',
          category: 'Cơm văn phòng',
          distanceKm: 2.4,
          rating: 4.8,
          status: 'approved',
          color: 'from-emerald-600 to-teal-500',
          menu: [
            { id: 'm4', name: 'Cơm sườn nướng mật ong', price: 35000, desc: 'Sườn cốt lết ướp đậm đà + đồ chua' },
            { id: 'm5', name: 'Cơm sườn bì chả ốp la', price: 45000, desc: 'Phần đặc biệt no căng bụng' },
            { id: 'm6', name: 'Trà tắc khổng lồ', price: 12000, desc: 'Giải nhiệt tươi mát' }
          ]
        },
        {
          id: 's3',
          name: 'Trà Sữa & Ăn Vặt GenZ',
          address: '18 Nguyễn Tất Thành (Cổng Trường THPT)',
          phone: '0905.777.888',
          category: 'Trà sữa & Ăn vặt',
          distanceKm: 3.1,
          rating: 4.7,
          status: 'approved',
          color: 'from-pink-500 to-rose-500',
          menu: [
            { id: 'm7', name: 'Trà sữa trân châu đường đen', price: 25000, desc: 'Size L full topping' },
            { id: 'm8', name: 'Mẹt cá viên chiên nước mắm', price: 40000, desc: 'Đủ loại viên chiên kèm đậu bắp' }
          ]
        }
      ],

      // Quán đang xem thực đơn & Giỏ hàng
      selectedStoreId: null,
      cart: [], // { storeId, itemId, name, price, qty }

      // Danh sách đơn hàng (bao gồm cả cuốc xe & đơn đồ ăn)
      orders: [
        {
          id: 'LG-1024',
          type: 'food', // 'ride' | 'food'
          customerName: 'Chị Lan (Khu Dân Cư Đồi Xanh)',
          storeId: 's1',
          storeName: 'Bún Đỏ & Bánh Canh Cô Ba',
          pickup: '45 Phan Chu Trinh',
          dropoff: 'Khu Dân Cư Đồi Xanh',
          itemsText: '2x Bún đỏ đặc biệt đầy đủ',
          distanceKm: 2.5,
          foodTotal: 60000,
          shippingFee: 15000,
          totalAmount: 75000,
          status: 'preparing', // 'pending' | 'preparing' | 'delivering' | 'completed'
          driverName: 'Nguyễn Văn Hùng (47B1-889.12)',
          createdAt: '09:30'
        },
        {
          id: 'LG-1023',
          type: 'ride',
          customerName: 'Anh Minh',
          vehicleName: 'LocalBike (Xe máy)',
          pickup: 'Ngã Sáu Trung Tâm',
          dropoff: 'Bến Xe Liên Tỉnh Phía Nam',
          distanceKm: 4.3,
          totalAmount: 26000,
          status: 'completed',
          driverName: 'Nguyễn Văn Hùng (47B1-889.12)',
          createdAt: '08:15'
        }
      ]
    };

    // ==========================================
    // 2. HÀM TIỆN ÍCH & TÍNH TOÁN KHOẢNG CÁCH
    // ==========================================

    function formatVND(amount) {
      return amount.toLocaleString('vi-VN') + 'đ';
    }

    // Mô phỏng Google Maps Distance Matrix: Tính khoảng cách tuyến đường thực tế (hệ số quanh co đường phố ~1.28)
    function calculateSimulatedRoute(pickupId, dropoffId) {
      if (pickupId === dropoffId) {
        return { distanceKm: 0.5, durationMin: 2 };
      }
      const p1 = LOCAL_PLACES.find(p => p.id === pickupId);
      const p2 = LOCAL_PLACES.find(p => p.id === dropoffId);
      const straightDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const roadDist = Math.max(1.0, Number((straightDist * 1.28).toFixed(1)));
      const durationMin = Math.max(3, Math.round(roadDist * 2.4)); // Trung bình 25km/h trong thị trấn
      return { distanceKm: roadDist, durationMin };
    }

    function calculateRideFare(distanceKm, vehicleId) {
      const v = VEHICLE_TYPES.find(item => item.id === vehicleId);
      // 2km đầu tính giá mở cửa, từ km thứ 3 nhân đơn giá
      let rawFare = distanceKm <= 2
        ? v.baseFare
        : v.baseFare + (distanceKm - 2) * v.rate;
      // Làm tròn đến hàng nghìn
      return Math.round(rawFare / 1000) * 1000;
    }

    // Hiển thị thông báo đẹp mắt thay vì alert()
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'warning' ? 'bg-amber-600' : 'bg-slate-800';
      const icon = type === 'success' ? 'fa-circle-check' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-info';

      toast.className = `${bgClass} text-white text-xs font-medium px-3.5 py-2.5 rounded-xl shadow-lg flex items-center gap-2 animate-fade-in`;
      toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    // ==========================================
    // 3. ĐIỀU HƯỚNG VAI TRÒ & CẬP NHẬT BADGE
    // ==========================================

    function switchRole(role) {
      state.currentRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        if (btn.dataset.role === role) {
          btn.className = 'role-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs font-semibold transition-all bg-emerald-600 text-white shadow-sm';
        } else {
          btn.className = 'role-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:bg-slate-100 relative';
        }
      });
      renderApp();
    }

    function updateBadges() {
      const activeJobs = state.orders.filter(o => o.status === 'pending' || o.status === 'preparing' || o.status === 'delivering').length;
      const pendingStores = state.stores.filter(s => s.status === 'pending').length;

      const driverBadge = document.getElementById('driver-badge');
      const adminBadge = document.getElementById('admin-badge');

      if (driverBadge) driverBadge.classList.toggle('hidden', activeJobs === 0);
      if (adminBadge) adminBadge.classList.toggle('hidden', pendingStores === 0);
    }

    // ==========================================
    // 4. RENDER GIAO DIỆN THEO TỪNG VAI TRÒ
    // ==========================================

    function renderApp() {
      updateBadges();
      const container = document.getElementById('app-content');

      if (state.currentRole === 'customer') {
        container.innerHTML = renderCustomerView();
      } else if (state.currentRole === 'merchant') {
        container.innerHTML = renderMerchantView();
      } else if (state.currentRole === 'driver') {
        container.innerHTML = renderDriverView();
      } else if (state.currentRole === 'admin') {
        container.innerHTML = renderAdminView();
      }
    }

    // ------------------------------------------
    // A. GIAO DIỆN KHÁCH HÀNG (CUSTOMER)
    // ------------------------------------------
    function renderCustomerView() {
      const activeOrdersCount = state.orders.filter(o => o.status !== 'completed').length;

      let bodyHtml = '';
      if (state.customerTab === 'ride') {
        bodyHtml = renderCustomerRideTab();
      } else if (state.customerTab === 'food') {
        bodyHtml = state.selectedStoreId ? renderStoreMenuDetail() : renderCustomerFoodTab();
      } else if (state.customerTab === 'orders') {
        bodyHtml = renderCustomerOrdersTab();
      }

      return `
        <!-- Header Khách hàng -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-4 pt-3 pb-4 rounded-b-3xl shadow-sm shrink-0">
          <div class="flex justify-between items-center mb-3">
            <div>
              <p class="text-[11px] text-emerald-100 flex items-center gap-1">
                <i class="fa-solid fa-location-dot"></i> Khu vực Thị trấn Trung Tâm
              </p>
              <h1 class="text-base font-bold tracking-tight">Xin chào, Minh Tuấn!</h1>
            </div>
            <div class="bg-white/20 backdrop-blur-sm px-2.5 py-1 rounded-full text-[11px] font-semibold flex items-center gap-1">
              <i class="fa-solid fa-wallet"></i> Tiền mặt / QR
            </div>
          </div>

          <!-- 3 Tab chính của Khách hàng -->
          <div class="grid grid-cols-3 gap-1.5 bg-emerald-800/40 p-1 rounded-xl">
            <button onclick="setCustomerTab('ride')" class="py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 ${state.customerTab === 'ride' ? 'bg-white text-emerald-700 shadow' : 'text-emerald-50 hover:bg-white/10'}">
              <i class="fa-solid fa-motorcycle"></i> Đặt xe
            </button>
            <button onclick="setCustomerTab('food')" class="py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 ${state.customerTab === 'food' ? 'bg-white text-emerald-700 shadow' : 'text-emerald-50 hover:bg-white/10'}">
              <i class="fa-solid fa-utensils"></i> Đồ ăn
            </button>
            <button onclick="setCustomerTab('orders')" class="py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 relative ${state.customerTab === 'orders' ? 'bg-white text-emerald-700 shadow' : 'text-emerald-50 hover:bg-white/10'}">
              <i class="fa-solid fa-receipt"></i> Đơn của tôi
              ${activeOrdersCount > 0 ? `<span class="bg-amber-400 text-slate-900 text-[10px] font-bold px-1.5 rounded-full">${activeOrdersCount}</span>` : ''}
            </button>
          </div>
        </div>

        <!-- Nội dung Tab -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-4">
          ${bodyHtml}
        </div>
      `;
    }

    function setCustomerTab(tab) {
      state.customerTab = tab;
      state.selectedStoreId = null;
      renderApp();
    }

    function renderCustomerRideTab() {
      const route = calculateSimulatedRoute(state.rideForm.pickupId, state.rideForm.dropoffId);
      const fare = calculateRideFare(route.distanceKm, state.rideForm.vehicleId);
      const p1 = LOCAL_PLACES.find(p => p.id === state.rideForm.pickupId);
      const p2 = LOCAL_PLACES.find(p => p.id === state.rideForm.dropoffId);

      const optionsHtml = LOCAL_PLACES.map(p => `<option value="${p.id}">${p.name} (${p.area})</option>`).join('');

      return `
        <div class="space-y-3.5 animate-fade-in">
          <!-- Bản đồ mô phỏng Google Maps Distance -->
          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 relative overflow-hidden">
            <div class="flex justify-between items-center mb-2">
              <span class="text-[11px] font-bold text-emerald-800 bg-emerald-200/70 px-2 py-0.5 rounded-md">
                <i class="fa-solid fa-route mr-1"></i>Đo tuyến đường Google Maps
              </span>
              <span class="text-xs font-extrabold text-emerald-700">
                ${route.distanceKm} km • ~${route.durationMin} phút
              </span>
            </div>
            <!-- Đồ họa tuyến đường trực quan -->
            <div class="bg-white/90 rounded-xl p-2.5 border border-emerald-100 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2 max-w-[42%]">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-600 shrink-0"></span>
                <span class="font-medium truncate text-slate-700">${p1.name}</span>
              </div>
              <div class="flex-1 mx-2 border-t-2 border-dashed border-emerald-400 relative flex justify-center">
                <span class="bg-emerald-600 text-white text-[10px] px-1.5 rounded -mt-2.5 font-bold">${route.distanceKm}km</span>
              </div>
              <div class="flex items-center gap-2 max-w-[42%] justify-end">
                <span class="font-medium truncate text-slate-700">${p2.name}</span>
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 shrink-0"></span>
              </div>
            </div>
          </div>

          <!-- Chọn điểm đón & điểm đến -->
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-3">
            <div>
              <label class="text-[11px] font-bold text-slate-500 uppercase flex items-center gap-1.5 mb-1">
                <i class="fa-solid fa-circle-dot text-blue-600"></i> Điểm đón bạn
              </label>
              <select onchange="updateRideForm('pickupId', this.value)" class="w-full text-xs font-semibold bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                ${LOCAL_PLACES.map(p => `<option value="${p.id}" ${p.id === state.rideForm.pickupId ? 'selected' : ''}>${p.name} - ${p.area}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="text-[11px] font-bold text-slate-500 uppercase flex items-center gap-1.5 mb-1">
                <i class="fa-solid fa-location-dot text-red-500"></i> Điểm muốn đến
              </label>
              <select onchange="updateRideForm('dropoffId', this.value)" class="w-full text-xs font-semibold bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                ${LOCAL_PLACES.map(p => `<option value="${p.id}" ${p.id === state.rideForm.dropoffId ? 'selected' : ''}>${p.name} - ${p.area}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- Chọn loại xe -->
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-700 px-1">Chọn phương tiện di chuyển</label>
            ${VEHICLE_TYPES.map(v => {
              const vFare = calculateRideFare(route.distanceKm, v.id);
              const isSelected = state.rideForm.vehicleId === v.id;
              return `
                <div onclick="updateRideForm('vehicleId', '${v.id}')" class="cursor-pointer rounded-2xl p-3 border-2 transition-all flex items-center justify-between ${isSelected ? 'border-emerald-600 bg-emerald-50/60 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'}">
                  <div class="flex items-center gap-3">

    function bookRide() {
      if (state.rideForm.pickupId === state.rideForm.dropoffId) {
        showToast('Vui lòng chọn điểm đến khác điểm đón!', 'warning');
        return;
      }
      const p1 = LOCAL_PLACES.find(p => p.id === state.rideForm.pickupId);
      const p2 = LOCAL_PLACES.find(p => p.id === state.rideForm.dropoffId);
      const v = VEHICLE_TYPES.find(item => item.id === state.rideForm.vehicleId);
      const route = calculateSimulatedRoute(state.rideForm.pickupId, state.rideForm.dropoffId);
      const fare = calculateRideFare(route.distanceKm, state.rideForm.vehicleId);

      const newOrder = {
        id: 'LG-' + Math.floor(1025 + Math.random() * 900),
        type: 'ride',
        customerName: 'Minh Tuấn (Khách hàng)',
        vehicleName: v.name,
        pickup: p1.name,
        dropoff: p2.name,
        distanceKm: route.distanceKm,
        totalAmount: fare,
        status: 'pending',
        driverName: null,
        createdAt: 'Vừa xong'
      };

      state.orders.unshift(newOrder);
      state.customerTab = 'orders';
      showToast('Đã gửi yêu cầu đặt xe! Tài xế đang nhận chuyến.');
      renderApp();

    function updateCart(storeId, itemId, delta) {
      const store = state.stores.find(s => s.id === storeId);
      const menuItem = store.menu.find(m => m.id === itemId);
      const existingIndex = state.cart.findIndex(c => c.itemId === itemId);

      if (existingIndex > -1) {
        state.cart[existingIndex].qty += delta;
        if (state.cart[existingIndex].qty <= 0) {
          state.cart.splice(existingIndex, 1);
        }
      } else if (delta > 0) {
        state.cart.push({
          storeId,
          itemId,
          name: menuItem.name,
          price: menuItem.price,
          qty: 1
        });
      }
      renderApp();
    }

    function placeFoodOrder(storeId) {
      const store = state.stores.find(s => s.id === storeId);
      const foodTotal = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const shippingFee = Math.max(10000, Math.round((store.distanceKm * 5000) / 1000) * 1000);
      const itemsText = state.cart.map(c => `${c.qty}x ${c.name}`).join(', ');

      const newOrder = {
        id: 'LG-' + Math.floor(1025 + Math.random() * 900),
        type: 'food',
        customerName: 'Minh Tuấn (Khách hàng)',
        storeId: store.id,
        storeName: store.name,
        pickup: store.address,
        dropoff: 'Nhà riêng - Phường Tân Lập',
        itemsText,
        distanceKm: store.distanceKm,
        foodTotal,
        shippingFee,
        totalAmount: foodTotal + shippingFee,
        status: 'pending',
        driverName: null,
        createdAt: 'Vừa xong'
      };

      state.orders.unshift(newOrder);
      state.cart = [];
      state.selectedStoreId = null;
      state.customerTab = 'orders';
      showToast('Đặt món thành công! Quán & Tài xế đã nhận thông báo.');
      renderApp();
    }

    function submitNewStore(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const category = document.getElementById('reg-category').value;
      const address = document.getElementById('reg-address').value.trim();
      const dish = document.getElementById('reg-dish').value.trim();
      const price = parseInt(document.getElementById('reg-price').value, 10) || 30000;
      const autoApprove = document.getElementById('reg-auto-approve').checked;

      const newStore = {
        id: 's' + (state.stores.length + 1),
        name,
        address,
        phone,
        category,
        distanceKm: Number((1.2 + Math.random() * 2.5).toFixed(1)),
        rating: 5.0,
        status: autoApprove ? 'approved' : 'pending',
        color: 'from-purple-500 to-indigo-600',
        menu: [
          { id: 'm-' + Date.now(), name: dish, price, desc: 'Món đặc trưng mới lên kệ' }
        ]
      };

      state.stores.unshift(newStore);
      if (autoApprove) {
        showToast('Đăng ký thành công! Quán đã hiển thị ở mục Đồ ăn của Khách hàng.');
      } else {
        showToast('Đã gửi hồ sơ! Chuyển sang tab Admin để duyệt quán mới.', 'warning');
      }
      state.merchantTab = 'orders';
      renderApp();
    }

    function renderDriverView() {
      const availableOrders = state.orders.filter(o => o.status !== 'completed');
      const completedOrders = state.orders.filter(o => o.status === 'completed');
      const todayIncome = completedOrders.reduce((sum, o) => sum + (o.type === 'ride' ? o.totalAmount : o.shippingFee), 0);

      return `
        <!-- Header Tài xế -->
        <div class="bg-slate-900 text-white px-4 pt-3 pb-4 rounded-b-3xl shadow-sm shrink-0">
          <div class="flex justify-between items-center mb-3">
            <div>
              <p class="text-[11px] text-slate-400">Đối tác Tài xế Địa phương</p>
              <h1 class="text-base font-bold">Nguyễn Văn Hùng • 47B1-889.12</h1>
            </div>
            <!-- Nút gạt Online/Offline -->
            <button onclick="state.driverOnline = !state.driverOnline; renderApp();" class="px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 transition-all ${state.driverOnline ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-slate-300'}">
              <span class="w-2 h-2 rounded-full ${state.driverOnline ? 'bg-slate-950 animate-pulse' : 'bg-slate-400'}"></span>
              ${state.driverOnline ? 'Đang trực tuyến' : 'Đang nghỉ'}
            </button>
          </div>

          <div class="bg-slate-800 rounded-2xl p-3 flex justify-between items-center">
            <div>
              <p class="text-[11px] text-slate-400">Thu nhập cước hôm nay</p>
              <p class="text-lg font-extrabold text-emerald-400">${formatVND(todayIncome)}</p>
            </div>
            <div class="text-right">
              <p class="text-[11px] text-slate-400">Chuyến hoàn thành</p>
              <p class="text-sm font-bold text-white">${completedOrders.length} chuyến</p>
            </div>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3">
          ${!state.driverOnline ? `
            <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-4 text-center text-xs space-y-1">
              <i class="fa-solid fa-power-off text-xl mb-1"></i>
              <p class="font-bold">Bạn đang tắt kết nối</p>
              <p>Bật nút "Đang trực tuyến" ở góc trên để nhận cuốc xe & đơn giao đồ ăn.</p>
            </div>
          ` : `
            <h2 class="text-xs font-bold text-slate-600 uppercase">Chuyến xe & Đơn giao hàng (${availableOrders.length})</h2>
            ${availableOrders.length === 0 ? '<p class="text-xs text-slate-400 text-center py-8">Hiện chưa có đơn mới. Hãy thử đặt xe ở tab Khách hàng!</p>' : ''}
            ${availableOrders.map(order => {
              const driverEarn = order.type === 'ride' ? order.totalAmount : order.shippingFee;
              return `
                <div class="bg-white rounded-2xl p-3.5 border-2 ${order.status === 'delivering' ? 'border-blue-500' : 'border-emerald-500'} shadow-sm space-y-2.5 animate-fade-in">
                  <div class="flex justify-between items-center">
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase ${order.type === 'ride' ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-800'}">
                      ${order.type === 'ride' ? 'Chở khách (' + order.vehicleName + ')' : 'Giao đồ ăn • ' + order.storeName}
                    </span>
                    <span class="text-sm font-extrabold text-emerald-700">+${formatVND(driverEarn)}</span>
                  </div>

                  <div class="text-xs space-y-1 bg-slate-50 p-2.5 rounded-xl">
                    <div class="font-semibold text-slate-800"><i class="fa-solid fa-circle-dot text-blue-600 mr-1.5"></i>Đón/Lấy: ${order.pickup}</div>
                    <div class="font-semibold text-slate-800"><i class="fa-solid fa-location-dot text-red-500 mr-1.5"></i>Trả/Giao: ${order.dropoff}</div>
                    <div class="text-[11px] text-slate-500 pt-1">Quãng đường: <b>${order.distanceKm} km</b> • Thu hộ khách: <b>${formatVND(order.totalAmount)}</b></div>
                  </div>

                  ${order.status === 'pending' || order.status === 'preparing' ? `
                    <button onclick="driverAcceptOrder('${order.id}')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow">
                      Nhận Chuyến Ngay
                    </button>
                  ` : `
                    <button onclick="driverCompleteOrder('${order.id}')" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow">
                      Xác Nhận Đã Hoàn Thành & Thu Tiền
                    </button>
                  `}
                </div>
              `;
            }).join('')}
          `}
        </div>
      `;
    }

    function driverAcceptOrder(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (order) {
        order.status = 'delivering';
        order.driverName = 'Nguyễn Văn Hùng (47B1-889.12)';
        showToast('Đã nhận chuyến! Đang di chuyển tới điểm đón.');
        renderApp();
      }
    }

    function driverCompleteOrder(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (order) {
        order.status = 'completed';
        showToast('Chúc mừng! Bạn đã hoàn thành chuyến đi.');
        renderApp();
      }
    }

    // ------------------------------------------
    // D. GIAO DIỆN QUẢN TRỊ VIÊN (ADMIN)
    // ------------------------------------------
    function renderAdminView() {
      const totalGMV = state.orders.reduce((s, o) => s + o.totalAmount, 0);
      const pendingStores = state.stores.filter(s => s.status === 'pending');

      return `
        <!-- Header Admin -->
        <div class="bg-indigo-900 text-white px-4 pt-3 pb-4 rounded-b-3xl shadow-sm shrink-0">
          <div class="flex justify-between items-center mb-3">
            <div>
              <p class="text-[11px] text-indigo-200">Trung Tâm Điều Hành LocalGo</p>
              <h1 class="text-base font-bold">Quản Trị Hệ Thống Địa Phương</h1>
            </div>
            <span class="bg-indigo-700 px-2.5 py-1 rounded-full text-[11px] font-semibold">~100 Users</span>
          </div>

          <!-- 4 Thẻ thống kê -->
          <div class="grid grid-cols-2 gap-2">
            <div class="bg-white/10 backdrop-blur-sm rounded-xl p-2.5">
              <p class="text-[10px] text-indigo-200">Tổng giá trị giao dịch</p>
              <p class="text-sm font-extrabold text-emerald-300">${formatVND(totalGMV)}</p>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-xl p-2.5">
              <p class="text-[10px] text-indigo-200">Tổng đơn / Cửa hàng</p>
              <p class="text-sm font-extrabold text-white">${state.orders.length} đơn • ${state.stores.length} quán</p>
            </div>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4">
          <!-- Danh sách quán chờ duyệt -->
          <div class="space-y-2">
            <h2 class="text-xs font-bold text-slate-700 uppercase flex items-center justify-between">
              <span>Cửa hàng chờ duyệt (${pendingStores.length})</span>
            </h2>
            ${pendingStores.length === 0 ? `
              <div class="bg-white rounded-xl p-3 border border-slate-200 text-xs text-slate-400 text-center">
                Không có cửa hàng nào đang chờ duyệt
              </div>
            ` : pendingStores.map(s => `
              <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-center justify-between gap-2">
                <div>
                  <h4 class="text-xs font-bold text-slate-900">${s.name}</h4>
                  <p class="text-[11px] text-slate-600">${s.address} • ${s.phone}</p>
                </div>
                <button onclick="approveStore('${s.id}')" class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-xl shrink-0">
                  Duyệt mở quán
                </button>
              </div>
            `).join('')}
          </div>

          <!-- Giám sát toàn bộ đơn hàng -->
          <div class="space-y-2">
            <h2 class="text-xs font-bold text-slate-700 uppercase">Giám sát đơn hàng trực tiếp</h2>
            ${state.orders.map(o => `
              <div class="bg-white rounded-xl p-3 border border-slate-200 text-xs flex justify-between items-center">
                <div>
                  <span class="font-bold text-slate-800">${o.id}</span>
                  <span class="text-slate-500"> (${o.type === 'ride' ? 'Gọi xe' : 'Đồ ăn'})</span>
                  <p class="text-[11px] text-slate-500 truncate max-w-[200px]">${o.pickup} → ${o.dropoff}</p>
                </div>
                <div class="text-right">
                  <div class="font-bold text-slate-900">${formatVND(o.totalAmount)}</div>
                  <span class="text-[10px] font-semibold ${o.status === 'completed' ? 'text-emerald-600' : 'text-amber-600'}">
                    ${o.status.toUpperCase()}
                  </span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function approveStore(storeId) {
      const store = state.stores.find(s => s.id === storeId);
      if (store) {
        store.status = 'approved';
        showToast(`Đã duyệt quán "${store.name}" lên hệ thống!`);
        renderApp();
      }
    }

    // Khởi chạy ứng dụng lần đầu
    window.onload = function () {
      renderApp();
    };
  </script>
</body>
</html>
