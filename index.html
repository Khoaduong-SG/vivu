    const state = {

    // ==========================================
    // 2. ĐĂNG NHẬP / ĐĂNG XUẤT THEO VAI TRÒ
    // ==========================================
    function selectLoginRole(role) {
      state.loginSelectedRole = role;
      renderApp();
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const nameInput = document.getElementById('login-name');
      const phoneInput = document.getElementById('login-phone');
      const role = state.loginSelectedRole;
      const preset = ROLE_PRESETS[role];

      const name = (nameInput?.value || '').trim() || preset.defaultName;
      const phone = (phoneInput?.value || '').trim() || preset.defaultPhone;

      state.currentUser = { role, name, phone };
      state.selectedStoreId = null;
      showToast(`Đăng nhập ${preset.title} (${name}) thành công!`);
      renderApp();
    }

    function quickDemoLogin(role) {
      const preset = ROLE_PRESETS[role];
      state.currentUser = {
        role,
        name: preset.defaultName,
        phone: preset.defaultPhone
      };
      state.selectedStoreId = null;
      showToast(`Đã vào giao diện ${preset.title}`);
      renderApp();
    }

    function logout() {
      state.currentUser = null;
      state.cart = [];
      state.selectedStoreId = null;
      showToast('Đã đăng xuất. Chọn vai trò để đăng nhập lại.', 'info');
      renderApp();
    }

    function renderLoginScreen() {
      const selectedRole = state.loginSelectedRole;
      const preset = ROLE_PRESETS[selectedRole];

      return `
        <div class="flex-1 flex flex-col justify-between p-5 bg-gradient-to-b from-emerald-50 via-white to-slate-50 animate-fade-in">
          <div>
            <!-- Logo & Thương hiệu Vivu -->
            <div class="text-center pt-2 pb-4">
              <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-500 text-white flex items-center justify-center text-2xl font-extrabold shadow-lg shadow-emerald-600/25 mb-2">
                V
              </div>
              <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Vivu Địa Phương</h1>
              <p class="text-xs text-slate-500 mt-0.5">Chọn vai trò & đăng nhập để mở giao diện riêng</p>
            </div>

            <!-- Chọn vai trò đăng nhập -->
            <div class="mb-4">
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">
                1. Chọn loại tài khoản
              </label>
              <div class="grid grid-cols-2 gap-2">
                ${Object.entries(ROLE_PRESETS).map(([key, info]) => {
                  const active = selectedRole === key;
                  return `
                    <button type="button" onclick="selectLoginRole('${key}')" class="text-left p-2.5 rounded-2xl border-2 transition-all flex items-center gap-2.5 ${active ? 'border-emerald-600 bg-emerald-50/70 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'}">
                      <div class="w-8 h-8 rounded-xl ${active ? info.badgeBg : 'bg-slate-100'} ${active ? 'text-white' : 'text-slate-600'} flex items-center justify-center text-sm shrink-0">
                        <i class="fa-solid ${info.icon}"></i>
                      </div>
                      <div class="min-w-0">
                        <div class="text-xs font-extrabold text-slate-900 truncate">${info.title}</div>
                        <div class="text-[10px] text-slate-500 truncate">${info.subtitle}</div>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Form đăng nhập -->
            <form onsubmit="handleLoginSubmit(event)" class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
              <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <span class="text-xs font-bold text-slate-800">2. Đăng nhập ${preset.title}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">${preset.title}</span>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Họ tên / Tên hiển thị</label>
                <input id="login-name" type="text" placeholder="VD: ${preset.defaultName}" class="w-full text-xs border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500" />

              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Số điện thoại</label>
                <input id="login-phone" type="tel" placeholder="VD: ${preset.defaultPhone}" class="w-full text-xs border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500" />
              </div>

              <button type="submit" class="w-full py-3 ${preset.btnClass} text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-2">

              </button>
            </form>

            <!-- Đăng nhập nhanh từng mục để test -->

              <p class="text-[10px] font-bold uppercase text-slate-400 mb-1.5 text-center">Vào nhanh giao diện mẫu từng mục</p>
              <div class="grid grid-cols-4 gap-1.5">

                <button type="button" onclick="quickDemoLogin('merchant')" class="py-1.5 px-1 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-800 text-[11px] font-bold">Chủ quán</button>
                <button type="button" onclick="quickDemoLogin('driver')" class="py-1.5 px-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-[11px] font-bold">Tài xế</button>
                <button type="button" onclick="quickDemoLogin('admin')" class="py-1.5 px-1 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-800 text-[11px] font-bold">Admin</button>
              </div>
            </div>
          </div>

    // ==========================================
    // 3. TIỆN ÍCH & TÍNH TOÁN
    // ==========================================
    function formatVND(amount) {
      return Number(amount || 0).toLocaleString('vi-VN') + 'đ';
    }

    function calculateSimulatedRoute(pickupId, dropoffId) {
      if (pickupId === dropoffId) {
        return { distanceKm: 0.5, durationMin: 2 };
      }
      const p1 = LOCAL_PLACES.find(p => p.id === pickupId);
      const p2 = LOCAL_PLACES.find(p => p.id === dropoffId);
      const straightDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const roadDist = Math.max(1.0, Number((straightDist * 1.28).toFixed(1)));
      const durationMin = Math.max(3, Math.round(roadDist * 2.4));
      return { distanceKm: roadDist, durationMin };
    }

    function calculateRideFare(distanceKm, vehicleId) {
      const v = VEHICLE_TYPES.find(item => item.id === vehicleId);
      const rawFare = distanceKm <= 2 ? v.baseFare : v.baseFare + (distanceKm - 2) * v.rate;
      return Math.round(rawFare / 1000) * 1000;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'warning' ? 'bg-amber-600' : 'bg-slate-800';
      const icon = type === 'success' ? 'fa-circle-check' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-info';

      toast.className = `${bgClass} text-white text-xs font-medium px-3.5 py-2.5 rounded-xl shadow-lg flex items-center gap-2 animate-fade-in`;
      toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // ==========================================
    // 4. RENDER GIAO DIỆN THEO VAI TRÒ ĐÃ ĐĂNG NHẬP
    // ==========================================
    function renderApp() {
      const container = document.getElementById('app-content');

      if (!state.currentUser) {
        container.innerHTML = renderLoginScreen();
        return;
      }

      const role = state.currentUser.role;
      if (role === 'customer') {
        container.innerHTML = renderCustomerView();
      } else if (role === 'merchant') {
        container.innerHTML = renderMerchantView();
      } else if (role === 'driver') {
        container.innerHTML = renderDriverView();
      } else if (role === 'admin') {
        container.innerHTML = renderAdminView();
      }
    }

    // --- KHÁCH HÀNG ---
    function renderCustomerView() {
      const activeOrdersCount = state.orders.filter(o => o.status !== 'completed').length;
      let bodyHtml = '';
      if (state.customerTab === 'ride') bodyHtml = renderCustomerRideTab();
      else if (state.customerTab === 'food') bodyHtml = state.selectedStoreId ? renderStoreMenuDetail() : renderCustomerFoodTab();
      else if (state.customerTab === 'orders') bodyHtml = renderCustomerOrdersTab();

      return `
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-4 pt-3 pb-4 rounded-b-3xl shadow-sm shrink-0">
          <div class="flex justify-between items-center mb-3">
            <div>
              <p class="text-[11px] text-emerald-100 flex items-center gap-1">
                <i class="fa-solid fa-user"></i> Khách hàng • ${state.currentUser.phone}
              </p>
              <h1 class="text-base font-bold tracking-tight">Xin chào, ${state.currentUser.name}!</h1>
            </div>
            <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-full text-[11px] font-semibold flex items-center gap-1 transition">
              <i class="fa-solid fa-right-from-bracket"></i> Đổi vai trò
            </button>
          </div>

          <div class="grid grid-cols-3 gap-1.5 bg-emerald-800/40 p-1 rounded-xl">
            <button onclick="setCustomerTab('ride')" class="py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 ${state.customerTab === 'ride' ? 'bg-white text-emerald-700 shadow' : 'text-emerald-50 hover:bg-white/10'}">
              <i class="fa-solid fa-motorcycle"></i> Đặt xe
            </button>
            <button onclick="setCustomerTab('food')" class="py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 ${state.customerTab === 'food' ? 'bg-white text-emerald-700 shadow' : 'text-emerald-50 hover:bg-white/10'}">
              <i class="fa-solid fa-utensils"></i> Đồ ăn
            </button>
            <button onclick="setCustomerTab('orders')" class="py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 relative ${state.customerTab === 'orders' ? 'bg-white text-emerald-700 shadow' : 'text-emerald-50 hover:bg-white/10'}">
              <i class="fa-solid fa-receipt"></i> Đơn của tôi
              ${activeOrdersCount > 0 ? `<span class="bg-amber-400 text-slate-900 text-[10px] font-bold px-1.5 rounded-full">${activeOrdersCount}</span>` : ''}
            </button>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto no-scrollbar p-4">${bodyHtml}</div>
      `;
    }

    function setCustomerTab(tab) {
      state.customerTab = tab;
      state.selectedStoreId = null;
      renderApp();
    }

    function renderCustomerRideTab() {
      const route = calculateSimulatedRoute(state.rideForm.pickupId, state.rideForm.dropoffId);
      const fare = calculateRideFare(route.distanceKm, state.rideForm.vehicleId);
      const p1 = LOCAL_PLACES.find(p => p.id === state.rideForm.pickupId);
      const p2 = LOCAL_PLACES.find(p => p.id === state.rideForm.dropoffId);

      return `
        <div class="space-y-3.5 animate-fade-in">
          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3">
            <div class="flex justify-between items-center mb-2">
              <span class="text-[11px] font-bold text-emerald-800 bg-emerald-200/70 px-2 py-0.5 rounded-md">
                <i class="fa-solid fa-route mr-1"></i>Đo tuyến đường
              </span>
              <span class="text-xs font-extrabold text-emerald-700">${route.distanceKm} km • ~${route.durationMin} phút</span>
            </div>
            <div class="bg-white/90 rounded-xl p-2.5 border border-emerald-100 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2 max-w-[42%]">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-600 shrink-0"></span>
                <span class="font-medium truncate text-slate-700">${p1.name}</span>
              </div>
              <div class="flex-1 mx-2 border-t-2 border-dashed border-emerald-400 relative flex justify-center">
                <span class="bg-emerald-600 text-white text-[10px] px-1.5 rounded -mt-2.5 font-bold">${route.distanceKm}km</span>
              </div>
              <div class="flex items-center gap-2 max-w-[42%] justify-end">
                <span class="font-medium truncate text-slate-700">${p2.name}</span>

          </button>

      `;

    function bookRide() {
      if (state.rideForm.pickupId === state.rideForm.dropoffId) {
        showToast('Vui lòng chọn điểm đến khác điểm đón!', 'warning');
        return;
      }
      const p1 = LOCAL_PLACES.find(p => p.id === state.rideForm.pickupId);
      const p2 = LOCAL_PLACES.find(p => p.id === state.rideForm.dropoffId);
      const v = VEHICLE_TYPES.find(item => item.id === state.rideForm.vehicleId);
      const route = calculateSimulatedRoute(state.rideForm.pickupId, state.rideForm.dropoffId);
      const fare = calculateRideFare(route.distanceKm, state.rideForm.vehicleId);

      state.orders.unshift({
        id: 'VV-' + Math.floor(1025 + Math.random() * 900),
        type: 'ride',
        customerName: state.currentUser?.name || 'Khách hàng',
        vehicleName: v.name,
        pickup: p1.name,
        dropoff: p2.name,
        distanceKm: route.distanceKm,
        totalAmount: fare,
        status: 'pending',
        driverName: null,
        createdAt: 'Vừa xong'
      });
      state.customerTab = 'orders';
      showToast('Đã đặt xe! Tài xế đang nhận chuyến.');
      renderApp();
    }

    function renderCustomerFoodTab() {
      const approvedStores = state.stores.filter(s => s.status === 'approved');
      return `
        <div class="space-y-3 animate-fade-in">

          ${approvedStores.map(store => `
            <div onclick="state.selectedStoreId = '${store.id}'; state.cart = []; renderApp();" class="cursor-pointer bg-white rounded-2xl p-3 border border-slate-200 shadow-sm hover:border-emerald-400 transition-all flex gap-3 items-center">
              <div class="w-14 h-14 rounded-xl bg-gradient-to-br ${store.color || 'from-emerald-500 to-teal-600'} text-white flex items-center justify-center text-xl shrink-0">
                <i class="fa-solid fa-bowl-food"></i>
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="text-xs font-bold text-slate-900 truncate">${store.name}</h3>
                <p class="text-[11px] text-slate-500 truncate">${store.address}</p>
                <div class="flex items-center gap-2 mt-1 text-[11px]">
                  <span class="text-amber-500 font-bold"><i class="fa-solid fa-star"></i> ${store.rating}</span>
                  <span class="text-slate-500">• ${store.distanceKm} km</span>
                </div>
              </div>
              <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
            </div>
          `).join('')}
        </div>

    function renderStoreMenuDetail() {
      const store = state.stores.find(s => s.id === state.selectedStoreId);
      if (!store) return '';
      const foodTotal = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const shippingFee = Math.max(10000, Math.round((store.distanceKm * 5000) / 1000) * 1000);
      const totalAmount = foodTotal + shippingFee;

      return `
        <div class="space-y-3 animate-fade-in pb-4">
          <button onclick="state.selectedStoreId = null; renderApp();" class="text-xs font-bold text-emerald-700 flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách quán
          </button>
          <div class="bg-white rounded-2xl p-3.5 border border-slate-200">
            <h2 class="text-sm font-extrabold text-slate-900">${store.name}</h2>
            <p class="text-xs text-slate-500">${store.address} • ${store.phone}</p>
          </div>
          <div class="space-y-2">
            ${store.menu.map(item => {
              const inCart = state.cart.find(c => c.itemId === item.id);
              const qty = inCart ? inCart.qty : 0;
              return `
                <div class="bg-white rounded-xl p-3 border border-slate-200 flex items-center justify-between gap-2">
                  <div>
                    <h4 class="text-xs font-bold text-slate-800">${item.name}</h4>
                    <p class="text-[11px] text-slate-500">${item.desc || ''}</p>
                    <p class="text-xs font-extrabold text-emerald-700 mt-1">${formatVND(item.price)}</p>
                  </div>
                  <div class="flex items-center gap-2">
                    ${qty > 0 ? `
                      <button onclick="updateCart('${store.id}', '${item.id}', -1)" class="w-7 h-7 rounded-lg bg-slate-100 font-bold">-</button>
                      <span class="text-xs font-bold w-4 text-center">${qty}</span>
                    ` : ''}
                    <button onclick="updateCart('${store.id}', '${item.id}', 1)" class="w-7 h-7 rounded-lg bg-emerald-600 text-white font-bold">+</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          ${state.cart.length > 0 ? `
            <div class="bg-slate-900 text-white rounded-2xl p-3.5 space-y-2">
              <div class="flex justify-between text-xs text-slate-300"><span>Tiền món:</span><span>${formatVND(foodTotal)}</span></div>
              <div class="flex justify-between text-xs text-slate-300"><span>Phí ship:</span><span>${formatVND(shippingFee)}</span></div>
              <div class="flex justify-between text-sm font-extrabold border-t border-slate-700 pt-2">
                <span>Tổng cộng:</span><span class="text-emerald-400">${formatVND(totalAmount)}</span>
              </div>
              <button onclick="placeFoodOrder('${store.id}')" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold text-xs rounded-xl">
                Đặt Giao Đồ Ăn Ngay
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function updateCart(storeId, itemId, delta) {
      const store = state.stores.find(s => s.id === storeId);
      const menuItem = store.menu.find(m => m.id === itemId);
      const idx = state.cart.findIndex(c => c.itemId === itemId);
      if (idx > -1) {
        state.cart[idx].qty += delta;
        if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
      } else if (delta > 0) {
        state.cart.push({ storeId, itemId, name: menuItem.name, price: menuItem.price, qty: 1 });
      }
      renderApp();
    }

    function placeFoodOrder(storeId) {
      const store = state.stores.find(s => s.id === storeId);
      const foodTotal = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const shippingFee = Math.max(10000, Math.round((store.distanceKm * 5000) / 1000) * 1000);
      const itemsText = state.cart.map(c => `${c.qty}x ${c.name}`).join(', ');

      state.orders.unshift({
        id: 'VV-' + Math.floor(1025 + Math.random() * 900),
        type: 'food',
        customerName: state.currentUser?.name || 'Khách hàng',
        storeId: store.id,
        storeName: store.name,
        pickup: store.address,
        dropoff: 'Địa chỉ khách tại địa phương',
        itemsText,
        distanceKm: store.distanceKm,
        foodTotal,
        shippingFee,
        totalAmount: foodTotal + shippingFee,
        status: 'pending',
        driverName: null,
        createdAt: 'Vừa xong'
      });
      state.cart = [];
      state.selectedStoreId = null;
      state.customerTab = 'orders';
      showToast('Đặt món thành công!');
      renderApp();
    }

          `).join('')}
        </div>
      `;
    }

    function submitNewStore(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const category = document.getElementById('reg-category').value;
      const address = document.getElementById('reg-address').value.trim();
      const dish = document.getElementById('reg-dish').value.trim();
      const price = parseInt(document.getElementById('reg-price').value, 10) || 30000;
      const autoApprove = document.getElementById('reg-auto-approve').checked;

      state.stores.unshift({
        id: 's' + (state.stores.length + 1),
        name,
        address,
        phone,
        category,
        distanceKm: Number((1.2 + Math.random() * 2.5).toFixed(1)),
        rating: 5.0,
        status: autoApprove ? 'approved' : 'pending',
        color: 'from-purple-500 to-indigo-600',
        menu: [{ id: 'm-' + Date.now(), name: dish, price, desc: 'Món đặc trưng mới' }]
      });

      showToast(autoApprove ? 'Đã mở quán thành công!' : 'Đã gửi hồ sơ chờ Admin duyệt.', autoApprove ? 'success' : 'warning');
      state.merchantTab = 'orders';
      renderApp();
    }

      const availableOrders = state.orders.filter(o => o.status !== 'completed');
      const completedOrders = state.orders.filter(o => o.status === 'completed');

      return `
        <div class="bg-slate-900 text-white px-4 pt-3 pb-4 rounded-b-3xl shadow-sm shrink-0">
          <div class="flex justify-between items-center mb-3">
            <div>
              <p class="text-[11px] text-slate-400">Tài xế • ${state.currentUser.name}</p>

            <button onclick="logout()" class="bg-white/15 hover:bg-white/25 px-2.5 py-1 rounded-full text-[11px] font-semibold">
              Đổi vai trò
            </button>
          </div>
          <div class="bg-slate-800 rounded-2xl p-3 flex justify-between items-center">
            <div>
              <p class="text-[11px] text-slate-400">Thu nhập hoàn thành</p>
              <p class="text-base font-extrabold text-emerald-400">${formatVND(todayIncome)}</p>

            <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-4 text-center text-xs">
              Bạn đang tạm nghỉ. Bật "Đang trực tuyến" để nhận đơn.
            </div>
          ` : availableOrders.map(order => {
            const earn = order.type === 'ride' ? order.totalAmount : order.shippingFee;
            return `
              <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-sm space-y-2">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-extrabold">${order.id} • ${order.type === 'ride' ? order.vehicleName : 'Giao đồ ăn'}</span>
                  <span class="text-xs font-extrabold text-emerald-700">+${formatVND(earn)}</span>

                <p class="text-[11px] text-slate-600">Đón: <b>${order.pickup}</b> → Giao: <b>${order.dropoff}</b> (${order.distanceKm} km)</p>

                ` : `
                  <button onclick="driverCompleteOrder('${order.id}')" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl">

                  </button>

              </div>

      const order = state.orders.find(o => o.id === orderId);

      return `
        <div class="bg-indigo-900 text-white px-4 pt-3 pb-4 rounded-b-3xl shadow-sm shrink-0">
          <div class="flex justify-between items-center mb-3">
            <div>
              <p class="text-[11px] text-indigo-200">Admin • ${state.currentUser.name}</p>
              <h1 class="text-base font-bold">Điều Hành Vivu Địa Phương</h1>
            </div>
            <button onclick="logout()" class="bg-white/15 hover:bg-white/25 px-2.5 py-1 rounded-full text-[11px] font-semibold">
              Đổi vai trò
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div class="bg-white/10 rounded-xl p-2.5">
              <p class="text-[10px] text-indigo-200">Tổng giá trị đơn</p>
              <p class="text-sm font-extrabold text-emerald-300">${formatVND(totalGMV)}</p>
            </div>
            <div class="bg-white/10 rounded-xl p-2.5">
              <p class="text-[10px] text-indigo-200">Đơn / Cửa hàng</p>
              <p class="text-sm font-extrabold">${state.orders.length} đơn • ${state.stores.length} quán</p>
            </div>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3">
          <h2 class="text-xs font-bold text-slate-700 uppercase">Cửa hàng chờ duyệt (${pendingStores.length})</h2>
          ${pendingStores.length === 0 ? `<p class="text-xs text-slate-400 bg-white p-3 rounded-xl border border-slate-200 text-center">Không có quán chờ duyệt</p>` : pendingStores.map(s => `
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-center justify-between gap-2">
              <div>
                <h4 class="text-xs font-bold">${s.name}</h4>
                <p class="text-[11px] text-slate-600">${s.address}</p>
              </div>
              <button onclick="approveStore('${s.id}')" class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-xl">
                Duyệt
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function approveStore(storeId) {
      const store = state.stores.find(s => s.id === storeId);
      if (store) {
        store.status = 'approved';
        showToast(`Đã duyệt quán "${store.name}"!`);
        renderApp();
      }
    }

    window.onload = function () {
      renderApp();
    };
  </script>
</body>
</html>
